# Integracion continua. Ningun cambio llega a produccion sin pasar estas tres puertas.
# Esto cubre el nivel 5 de la rubrica de herramientas, calidad verificada antes de desplegar.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas de la logica central
        run: npm test
